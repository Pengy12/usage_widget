<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Usage Widget</title>
    <link rel="stylesheet" href="popover.css" />
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <div class="header-left">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="title">Claude Usage</span>
        </div>
        <button id="refresh" title="Refresh">&#8635;</button>
      </div>
      <div class="divider"></div>

      <div id="message" class="message" hidden></div>

      <div id="bars">
        <div class="row">
          <div class="row-top">
            <div class="row-text">
              <span class="row-title">Session</span>
              <span id="session-reset" class="row-sub"></span>
            </div>
            <span id="session-pct" class="row-pct">&ndash;</span>
          </div>
          <div class="bar-track"><div id="session-fill" class="bar-fill"></div></div>
        </div>

        <div class="row">
          <div class="row-top">
            <div class="row-text">
              <span class="row-title">Weekly</span>
              <span id="weekly-reset" class="row-sub"></span>
            </div>
            <span id="weekly-pct" class="row-pct">&ndash;</span>
          </div>
          <div class="bar-track"><div id="weekly-fill" class="bar-fill"></div></div>
        </div>
      </div>

      <div class="divider"></div>
      <div id="updated" class="updated"></div>
    </div>
    <script src="popover.js"></script>
  </body>
</html>
